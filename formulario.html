    <section>
      <div class="contacto">
        <h1>Contacto</h1>
        <p>Si tienes alguna sugerencia puedes contactar conmigo rellenando el formulario:</p>
        <form action="mailto:martaclj@example.com" method="post" enctype="text/plain">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="abcd@mail.com">

          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe aquí..."></textarea>

          <div class="form-botones">
            <button type="submit">Enviar Mensaje</button>
            <button type="reset" class="secundario">Limpiar</button>
          </div>
        </form>
      </div>
